[workspace]
members = ["crates/lob", "crates/feed", "crates/sim", "crates/signal", "crates/strategy", "crates/study"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.6.7", features = ["derive"] }
criterion = "0.8.2"
futures-util = "0.3"
proptest = "1.11.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "signal"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
zstd = "0.14.0"
